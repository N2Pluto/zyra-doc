<meta charset="utf-8">
<title>Accessory Management POC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: scenario toolbar on top, then the 1440×1024 Figma frame scaled to fit the viewport width.
   Single dark theme on purpose: every value is lifted from Figma file Map8gX0L2hk7HnkaFRfhtj.
   Sprites are the real files from demo file/custom avatar (192×192, 4 rows × 4 cols, 48px frames). */
:root{
  --bg:#2B3540; --panel:#242B32; --well:#1A1B1E; --row-line:#3B4046;
  --fg:#FFFFFF; --grey500:#8C99A6; --grey600:#7F8B97; --grey700:#636D76;
  --grey100:#DBDFE3; --grey300:#B2BBC3; --grey400:#A3ADB8;
  --primary:#58D68D; --red:#F03A3A; --blue:#2DB6FF; --orange:#FF8000;
  --w5:rgba(255,255,255,.05); --w10:rgba(255,255,255,.1); --w20:rgba(255,255,255,.2);
  --font:"Inter","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#15181C;color:var(--fg);font-family:var(--font);font-size:14px;line-height:18px;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.fi{display:inline-block;flex:0 0 auto;background:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-position:center;mask-position:center}
.tchev{display:inline-flex;transition:transform .15s}.tchev.down{transform:rotate(180deg)}
.cat .input .fi{color:var(--grey700)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px;color:var(--grey500);font-size:13px}
.bar strong{color:var(--fg);font-weight:600;font-size:15px;margin-right:4px}
.bar .grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px solid var(--w10);border-radius:10px;padding:4px 6px}
.bar .grp span{font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:0 4px;color:var(--grey700)}
.bar .sc{height:28px;padding:0 10px;border-radius:7px;background:var(--w5);color:var(--fg);font-size:13px}
.bar .sc:hover{background:var(--w10)}
.bar .sc[aria-pressed="true"]{background:var(--primary);color:#0E2A1A;font-weight:600}
.note{font-size:12px;color:var(--grey500);margin:0 0 12px;max-width:120ch}
.note b{color:var(--fg);font-weight:500}

.stage{width:100%;overflow:hidden}
.frame{width:1440px;height:1024px;background:var(--bg);position:relative;overflow:hidden;transform-origin:top left;border-radius:6px}

.sidebar{position:absolute;left:0;top:0;width:275px;height:1024px;background:var(--panel);padding:16px;display:flex;flex-direction:column;align-items:center;gap:24px}
.logo{width:56px;height:56px;border-radius:12px;background:#58D68D;display:grid;place-items:center;color:#0E2A1A;font-weight:700;font-size:30px;letter-spacing:-.04em}
.logo::after{content:"Z"}
.nav{display:flex;flex-direction:column;gap:8px;width:100%}
.nav .sect{display:flex;flex-direction:column;gap:8px;width:100%}
.nav .sects{display:flex;flex-direction:column;gap:24px;width:100%}
.tmenu{display:flex;align-items:center;justify-content:space-between;color:var(--grey500);width:100%;text-align:left}
.tmenu:hover{color:var(--fg)}
.tmenu svg{width:14px;height:14px}
.menu{display:flex;align-items:center;gap:8px;min-height:42px;padding:12px;border-radius:8px;width:100%;text-align:left}
.menu .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu .cnt{color:var(--grey500)}
.menu.active{background:rgba(88,214,141,.1);color:var(--primary)}
.menu:hover:not(.active){background:var(--w5)}
.headbar{position:absolute;left:275px;top:0;width:1165px;height:72px;background:var(--panel);padding:8px 16px;display:flex;align-items:center;justify-content:flex-end;gap:16px}
.lang{display:flex;align-items:center;gap:8px;padding:10px 8px;border-radius:8px;background:var(--w10)}
.flag{width:24px;height:24px;border-radius:50%;background:linear-gradient(#C8102E 0 0) center/100% 6px no-repeat,linear-gradient(#C8102E 0 0) center/6px 100% no-repeat,#012169}
.profile{display:flex;align-items:center;gap:8px;font-weight:700}
.av{width:40px;height:40px;border-radius:90px;background:#7EA2FC;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff}

.panel{position:absolute;top:88px;background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column}
.cat{left:288px;width:368px;height:920px;gap:16px}
.cat h2{margin:0;font-size:20px;font-weight:700;line-height:normal}
.cat .sub{color:var(--grey500)}
.cat .hd{display:flex;flex-direction:column;gap:8px}
.cat .list{display:flex;flex-direction:column;gap:24px;overflow:hidden auto;flex:1;min-height:0;scrollbar-width:thin}
.input{height:42px;border:1px solid var(--w20);border-radius:8px;background:var(--panel);padding:8px 12px;display:flex;align-items:center;gap:8px;width:100%;color:var(--fg)}
.input input{all:unset;flex:1;min-width:0;color:var(--fg);font:inherit}
.input input::placeholder{color:var(--grey700)}
.input.ro{background:linear-gradient(var(--w5),var(--w5)),var(--panel);color:var(--grey600)}
.input.err{border-color:var(--red)}
.input .ph{flex:1;color:var(--grey700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.input.ro .ph{color:var(--grey600)}

.main{left:672px;width:752px;height:920px;gap:24px}
.main.wide{left:288px;width:1136px}
.main.center{align-items:center;justify-content:center;gap:40px}
.empty{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.empty .img{width:100px;height:100px;border-radius:8px;display:grid;place-items:center;color:#F5B942}
.empty .img svg{width:72px;height:72px;stroke-width:1.5}
.empty h3{margin:0;font-size:16px;line-height:22px;font-weight:700}
.empty p{margin:0;color:var(--grey500)}
.empty .t{display:flex;flex-direction:column;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:8px 16px;border-radius:8px;font-size:16px;line-height:22px;white-space:nowrap}
.btn.h42{height:42px}
.btn.sm{height:32px;padding:8px 16px;border-radius:6px;font-size:14px;line-height:18px}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:#4DC47D}
.btn.white{background:#fff;color:var(--well)}
.btn.disabled{background:var(--grey100);border:1px solid var(--grey300);color:var(--grey400);cursor:not-allowed}
.btn.danger{background:rgba(240,58,58,.05);border:1px solid rgba(240,58,58,.2);color:var(--red)}
.btn.danger.solid{background:var(--red);color:#fff;border:0}
.btn.ghost{background:var(--w5);border:1px solid var(--w20);color:var(--fg)}
.btn.icon{width:42px;height:42px;padding:8px}
.btn.icon.sm{width:32px;height:32px;padding:8px;border-radius:6px}

.ttl{display:flex;align-items:center;justify-content:space-between;width:100%}
.ttl h2{margin:0;font-size:20px;font-weight:700;line-height:normal}
.lhead{display:flex;flex-direction:column;gap:16px;width:100%}
.srow{display:flex;gap:8px;width:100%}
.meta{display:flex;align-items:center;justify-content:space-between;width:100%}
.meta .sort{display:flex;align-items:center;gap:8px}
.grid{display:flex;flex-wrap:wrap;gap:16px;align-content:flex-start;flex:1;min-height:0;overflow:hidden;width:100%}
.card{width:168px;background:var(--bg);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden;cursor:pointer;text-align:left}
.card:hover{outline:1px solid var(--w20)}
.card .top{display:flex;align-items:center;justify-content:space-between}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 4px;border-radius:4px;font-size:12px;line-height:15px;letter-spacing:-.0516px}
.tag svg{width:14px;height:14px}
.tag.active{background:rgba(88,214,141,.1);border:1px solid rgba(88,214,141,.1);color:var(--primary)}
.tag.hidden{background:var(--w5);border:1px solid var(--w10);color:var(--grey500)}
.count{background:var(--well);border-radius:90px;padding:1px;min-width:18px;text-align:center;font-size:10px;line-height:14px;font-weight:500}
.card .img{height:80px;padding:8px;border-radius:8px;display:grid;place-items:center}
.card .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .dt{display:flex;gap:4px;align-items:flex-start;color:var(--grey500);font-size:12px;line-height:15px;letter-spacing:-.0516px}
.card .dt svg{width:14px;height:14px}
.card .cl{position:absolute;left:50%;bottom:61px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;font-size:10px;line-height:13px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25)}
.pager{display:flex;justify-content:flex-end;align-items:center;gap:8px;width:100%}
.pg{width:32px;height:32px;border-radius:6px;background:var(--w5);border:1px solid var(--w20);display:grid;place-items:center}
.pg.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pg.sel{width:auto;padding:0 12px;display:flex;gap:8px;align-items:center}

.submenu{position:absolute;width:200px;background:var(--panel);border-radius:16px;padding:8px;box-shadow:0 4px 16px rgba(255,255,255,.08);display:flex;flex-direction:column;z-index:2}
.submenu .t{padding:8px;font-size:12px;line-height:15px;color:var(--grey500);letter-spacing:-.0516px}
.chk{width:16px;height:16px;border-radius:4px;background:var(--primary);display:grid;place-items:center;color:#0E2A1A}
.chk svg{width:12px;height:12px;stroke-width:3}

.form{display:flex;gap:40px;flex:1;min-height:0;width:100%}
.form .left{width:640px;display:flex;flex-direction:column;gap:24px;overflow:hidden auto;scrollbar-width:thin;padding-right:2px}
.form .right{flex:1;min-width:0;display:flex;flex-direction:column;gap:24px;align-items:center}
.sec{display:flex;flex-direction:column;gap:24px;width:100%}
.sech{display:flex;flex-direction:column;gap:8px;width:100%}
.sech h3{margin:0;font-size:16px;line-height:22px;font-weight:500;display:flex;align-items:center;gap:8px}
.sech p{margin:0;color:var(--grey500)}
.fields{display:flex;flex-direction:column;gap:16px;width:100%}
.field{display:flex;flex-direction:column;gap:8px;width:100%}
.counter{display:flex;justify-content:space-between;align-items:center;font-size:12px;line-height:15px;letter-spacing:-.0516px;color:var(--grey500)}
.counter b{color:var(--fg);font-weight:600}
.counter .e{color:var(--red);flex:1}
.counter .n{margin-left:auto}
.radios{display:flex;gap:16px}
.radio{display:flex;align-items:center;gap:8px}
.radio i{width:16px;height:16px;border-radius:50%;border:1px solid var(--grey500);display:grid;place-items:center}
.radio.on i{border-color:var(--primary)}
.radio.on i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
.radio.dis i{border-color:var(--grey700);background:var(--grey700)}
.two{display:flex;gap:16px;width:100%}
.two .field{flex:1}
.switch{width:48px;height:24px;border-radius:12px;background:var(--w20);position:relative;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on{background:var(--primary)}
.switch.on::after{transform:translateX(24px)}
.status{display:flex;align-items:center;gap:8px;height:42px}
.status .on{color:var(--primary)}
.status .off{color:var(--grey500)}
.divider{height:1px;background:var(--w20);width:100%;flex:0 0 auto}
.alert{background:rgba(45,182,255,.1);border:1px solid rgba(45,182,255,.2);border-radius:8px;padding:8px;display:flex;align-items:center;gap:8px;color:var(--blue);width:100%}
.upload{display:flex;flex-direction:column;gap:16px;width:100%}
.table{display:flex;flex-direction:column;width:100%}
.tr{display:flex;width:100%}
.th{height:56px;padding:12px;display:flex;align-items:center;gap:4px;color:var(--grey500);border-bottom:1px solid var(--w20)}
.td{height:56px;padding:12px;display:flex;align-items:center;border-bottom:1px solid var(--row-line)}
.c-wheel{width:40px;justify-content:center}
.c-name{flex:1;min-width:0}
.c-file{width:200px;justify-content:center}
.wheel{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.4);background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.wheel.g{background:var(--grey500)}
.chip{background:var(--w5);border-radius:8px;padding:8px;display:flex;align-items:flex-end;gap:8px;flex:1;min-width:0}
.chip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.variant{display:flex;flex-direction:column;align-items:flex-end;gap:16px;width:100%}
.gen{background:var(--bg);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:16px;width:100%}
.gen .l{font-weight:500}
.drop{background:var(--w5);border:1px dashed var(--w20);border-radius:8px;padding:24px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--grey500);cursor:pointer}
.drop:hover{border-color:var(--primary)}
.drop u{color:var(--fg)}
.file{background:var(--w5);border-radius:8px;padding:8px;display:flex;align-items:center;gap:16px}
.file .ic{width:40px;height:40px;border-radius:8px;background:var(--w5);border:1px solid var(--w20);display:grid;place-items:center}
.file .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.file small{font-size:12px;line-height:15px;color:var(--grey500)}
.file small b{color:var(--primary);font-weight:400}
.file .del{color:var(--red)}
.tabs{display:flex;padding:4px;border:1px solid var(--w20);border-radius:8px;width:100%}
.tabs button{flex:1;height:32px;padding:8px;border-radius:8px;display:grid;place-items:center}
.tabs button[aria-selected="true"]{background:rgba(88,214,141,.2)}
.preview{height:300px;width:100%;background:var(--bg);border-radius:16px;position:relative;display:grid;place-items:center}
.preview .ctl{position:absolute;right:8px;bottom:8px;display:flex;gap:8px}
.swatches{display:flex;gap:8px;width:376px;justify-content:center} /* 12 × 24 + 11 × 8 = 376 (Figma Colour row) */
.colourpick{display:flex;flex-direction:column;gap:16px;width:376px}
.shade{display:flex;flex-direction:column;gap:8px;width:100%}
.shadehd{display:flex;align-items:center;justify-content:space-between;font-size:14px;line-height:18px}
.shadeval{display:flex;align-items:center;gap:8px;color:var(--grey500);font-size:12px;line-height:15px;font-variant-numeric:tabular-nums}
.shadeval i{width:16px;height:16px;border-radius:50%;border:1px solid var(--w20);display:block}
.shadeends{display:flex;justify-content:space-between;font-size:12px;line-height:15px;color:var(--grey500)}
#shadeRange{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:100px;background:var(--track);outline:none;margin:0;cursor:pointer}
#shadeRange::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--well);box-shadow:0 0 0 1px var(--w20)}
#shadeRange::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--well);box-shadow:0 0 0 1px var(--w20)}
#shadeRange:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.swatches button{width:24px;height:24px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.3)}
.swatches button[aria-pressed="true"]{outline:2px solid var(--primary);outline-offset:2px}
.titlebtns{display:flex;gap:8px}
.back{display:flex;align-items:center;gap:8px}

.overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:3}
.modal{width:458px;background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:24px;backdrop-filter:blur(4px)}
.modal .mh{display:flex;flex-direction:column;gap:16px}
.modal .mt{display:flex;align-items:center;justify-content:space-between;font-size:16px;line-height:22px;font-weight:500}
.modal .mt svg{width:24px;height:24px}
.modal p{margin:0;color:var(--grey500)}
.modal .mf{display:flex;justify-content:flex-end;gap:8px}
.toast{position:absolute;right:16px;top:16px;width:336px;background:var(--well);border-radius:16px;padding:16px;box-shadow:0 4px 8px rgba(255,255,255,.08);display:flex;gap:16px;align-items:flex-start;z-index:3}
.toast .ib{width:40px;height:40px;border-radius:8px;padding:8px;display:grid;place-items:center;flex:0 0 auto}
.toast .ib svg{width:24px;height:24px}
.toast .ib.ok{background:rgba(88,214,141,.2);color:var(--primary)}
.toast .ib.bad{background:rgba(240,58,58,.2);color:var(--red)}
.toast .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;align-self:center}
.toast .tx b{font-weight:700}
.toast .x{align-self:center}
.picker{position:absolute;left:356px;top:497px;width:280px;background:var(--well);border:1px solid var(--w20);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:16px;filter:drop-shadow(0 12px 8px rgba(5,32,81,.09)) drop-shadow(0 4px 3px rgba(5,32,81,.04));z-index:2}
.picker .pal{height:248px;border-radius:8px;background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,#0800F4);position:relative}
.picker .pal i{position:absolute;left:70%;top:65%;width:12px;height:12px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.picker .hue{height:12px;border-radius:100px;background:linear-gradient(90deg,#f00 0%,#ff4e00 8%,#ffc400 17%,#eaf900 21%,#8cff00 26%,#2fff00 31%,#00ffb2 44%,#00bbff 54%,#0037ff 70%,#6a00f5 70%,#fe00d4 83%,#fd007f 89%,#ff002b 96%,#ff0030)}
.picker .sat{height:12px;border-radius:100px;background:linear-gradient(90deg,transparent,#0800F4),repeating-conic-gradient(#555 0 25%,#333 0 50%) 0 0/10px 10px}
.picker .row{display:flex;align-items:center;gap:10px}
.picker .sl{flex:1;display:flex;flex-direction:column;gap:8px}
.picker .vals{display:flex;gap:4px;align-items:stretch}
.picker .dd{width:72px;background:#232427;border:1px solid #B1B6BF;border-radius:8px;padding:8px;display:flex;align-items:center;gap:4px;font-weight:500}
.picker .v{flex:1;display:flex;gap:1px}
.picker .v span{flex:1;background:#232427;padding:8px 4px;text-align:center;font-size:12px;font-weight:500}
.picker .v span:first-child{border-radius:4px 0 0 4px}.picker .v span:last-child{border-radius:0 4px 4px 0}
.picker h4{margin:0;font-size:14px;line-height:20px;font-weight:600;color:var(--grey500)}
.picker .sw{display:flex;flex-wrap:wrap;gap:8px}
.picker .sw i{width:24px;height:24px;border-radius:50%;display:block}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--grey700);pointer-events:none}
@media (prefers-reduced-motion:reduce){.switch::after{transition:none}}
</style>

<div class="bar" id="bar">
  <strong>Accessory Management POC</strong>
  <span style="font-size:12px">คลิกเลือก scenario · ค่าทั้งหมดจาก Figma · sprite จริงจาก demo file/custom avatar (72 ไฟล์)</span>
</div>
<p class="note" id="note"></p>

const FI=(uri,size=16)=>`<i class="fi" style="width:${size}px;height:${size}px;-webkit-mask-image:url(${uri});mask-image:url(${uri})" aria-hidden="true"></i>`;

/* ---------- catalog ---------- */
const CATS={Head:["Hair","Eyes","Face","Facial Hair"],Body:["Top","Outer","Dress","Bottoms","Shoes","Special Costume"],Accessory:["Hat","Glasses","Mask","Neck","Belt","Bag","Back","Companion"]};
const TWO_SHEETS=["Top","Outer","Dress","Bottoms","Special Costume"];
const CH_OF={Hair:"hair","Facial Hair":"hair",Eyes:"eye"}; // other categories → primary (cloth)
const SW=["#FFFFFF","#1A1B1E","#F03A3A","#ECC819","#2DB6FF","#996ADF","#D457F0","#2C5AE4","#FF8000","#58D68D","#7B2FBE","#19C9C9"];
// Main colours = the 12 dots in Figma's "Colour" row (376×24). Shade slider derives every other tone from them.
const HUES=SW.slice(0,12);
const SHADE_LIGHT=0.85, SHADE_DARK=0.75; // how far the slider can go toward white / black
function shadeHex(hex,shade){ // shade 0..100, 50 = the main colour itself
  const c=hex2rgb(hex),t=(shade-50)/50;
  const m=t<0?mix(c,[255,255,255],-t*SHADE_LIGHT):mix(c,[0,0,0],t*SHADE_DARK);
  return "#"+m.map(v=>Math.round(v).toString(16).padStart(2,"0")).join("").toUpperCase();
}
function shadeTrack(hex){return `linear-gradient(90deg,${shadeHex(hex,0)} 0%,${hex} 50%,${shadeHex(hex,100)} 100%)`}

const byId=id=>PARTS.find(p=>p.id===id);
const byCat=c=>PARTS.filter(p=>p.cat===c);

/* ---------- palette swap (same rules as the Avatar Studio prototype) ---------- */
const W=48,H=48,ROW={down:0,left:1,right:2,up:3};
const KEY={skin:["#FFA0FF","#FF00FF","#A000A0","#500050"],hair:["#A0FFFF","#00FFFF","#00A0A0","#005050"],eye:["#FFFFA0","#FFFF00","#A0A000","#505000"],primary:["#FFA0A0","#FF0000","#A00000","#500000"],secondary:["#A0FFA0","#00FF00","#00A000","#005000"]};
const hex2rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const lum=([r,g,b])=>r*.299+g*.587+b*.114;
const KEY_L=Object.fromEntries(Object.entries(KEY).map(([c,a])=>[c,a.map(h=>lum(hex2rgb(h)))]));
const FAMILY=[["skin",(r,g,b)=>Math.abs(r-b)<=3&&g<=Math.min(r,b)*.7],["hair",(r,g,b)=>Math.abs(g-b)<=3&&r<=Math.min(g,b)*.7],["eye",(r,g,b)=>Math.abs(r-g)<=3&&b<=Math.min(r,g)*.7],["primary",(r,g,b)=>Math.abs(g-b)<=3&&Math.max(g,b)<=r*.7],["secondary",(r,g,b)=>Math.abs(r-b)<=3&&Math.max(r,b)<=g*.7]];
function classifyKey(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx<40||mx-mn<40)return null;const f=FAMILY.find(([,t])=>t(r,g,b));return f?f[0]:null}
function rampT(ch,rgb){const L=lum(rgb),A=KEY_L[ch];if(L>=A[0])return 0;if(L<=A[3])return 3;for(let i=0;i<3;i++)if(L<=A[i]&&L>A[i+1])return i+(A[i]-L)/(A[i]-A[i+1]);return 3}
const mix=(a,b,f)=>a.map((v,i)=>v+(b[i]-v)*f);
function rampOf(hex){const c=hex2rgb(hex);return[mix(c,[255,255,255],.35),c,mix(c,[0,0,0],.3),mix(c,[0,0,0],.6)]}
function rampColor(ramp,t){if(Number.isInteger(t))return ramp[t];const i=Math.floor(t),f=t-i;return mix(ramp[i],ramp[Math.min(3,i+1)],f)}
const DEF_RAMP={hair:["#5A5A66","#2E2E38","#1C1C24","#0A0A0F"].map(hex2rgb),eye:["#7FD6D2","#2F8F94","#17555A","#0A2A2E"].map(hex2rgb),skin:["#FEE8D6","#FFE8BF","#FFD3B0","#F6AF83"].map(hex2rgb)};

const sheetCache=new Map();
function loadSheet(uri,fixed){
  const k=uri.slice(-80)+(fixed?"f":"k");
  if(sheetCache.has(k))return sheetCache.get(k);
  const p=new Promise(res=>{const im=new Image();im.onload=()=>{
    const c=document.createElement("canvas");c.width=192;c.height=192;const x=c.getContext("2d");x.drawImage(im,0,0);
    const d=x.getImageData(0,0,192,192).data,frames=[];
    for(let r=0;r<4;r++)for(let col=0;col<4;col++){const fr=new Array(W*H).fill(null);
      for(let y=0;y<H;y++)for(let px=0;px<W;px++){const i=((r*48+y)*192+col*48+px)*4;if(d[i+3]<128)continue;const R=d[i],G=d[i+1],B=d[i+2];
        const ch=fixed?null:classifyKey(R,G,B);fr[y*W+px]=ch?{ch,t:rampT(ch,[R,G,B])}:{c:[R,G,B]}}
      frames.push(fr)}
    res({frames})};im.onerror=()=>res(null);im.src=uri});
  sheetCache.set(k,p);return p;
}
function blit(ctx,fr,scale,ox,oy,pal){
  for(let k=0;k<W*H;k++){const p=fr[k];if(!p)continue;const c=p.c||rampColor(pal(p.ch),p.t);ctx.fillStyle=`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;ctx.fillRect(ox+(k%W)*scale,oy+Math.floor(k/W)*scale,scale,scale)}
}
/* draw one layer (sheet) at dir/col; falls back walk→sit when the part has no sit sheet */
async function drawLayer(ctx,uriWalk,uriSit,fixed,sheet,dir,col,scale,ox,oy,pal){
  let uri=uriWalk,c=col;
  if(sheet==="sit"){if(uriSit)uri=uriSit;else c=1}
  const s=await loadSheet(uri,fixed);if(!s)return;
  blit(ctx,s.frames[ROW[dir]*4+c],scale,ox,oy,pal);
}
// The swatch colour drives the item's own channel: clothes → primary/secondary, Eyes → eye, Hair/Facial Hair → hair.
// Other key channels on the item (e.g. skin showing on a top) keep their default ramp.
function paletteFor(colourHex,cat){const own=CH_OF[cat];return ch=>{if(ch==="primary"||ch==="secondary"||ch===own)return rampOf(colourHex);return DEF_RAMP[ch]||rampOf(colourHex)}}
function partSheets(part,variant){if(part.variants){const v=part.variants[variant||0];return{walk:v.walk,sit:v.sit}}return{walk:part.walk,sit:part.sit}}

/* paint all canvases currently in the DOM */
let paintSeq=0;
async function drawBase(ctx,sheet,dir,col,scale,ox,oy,part){
  await drawLayer(ctx,BASE.walk,BASE.sit,true,sheet,dir,col,scale,ox,oy,null);
  if(!part||part.cat!=="Eyes"){const e=byId("eye1");if(e)await drawLayer(ctx,e.walk,e.sit,false,sheet,dir,col,scale,ox,oy,ch=>DEF_RAMP[ch]||rampOf("#1A1B1E"))}
}
async function paintAll(){
  const seq=++paintSeq;
  for(const cv of document.querySelectorAll("canvas[data-part]")){
    const part=byId(cv.dataset.part),withBase=cv.dataset.base==="1";
    if(!part&&!withBase)continue;
    const scale=+cv.dataset.scale,dir=cv.dataset.dir||"down",sheet=cv.dataset.sheet||"walk",col=+(cv.dataset.col||1);
    const colour=cv.dataset.colour||S.colour,variant=+(cv.dataset.variant||0);
    const ctx=cv.getContext("2d");ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,cv.width,cv.height);
    const ox=Math.round((cv.width-48*scale)/2),oy=Math.round((cv.height-48*scale)/2);
    const chair=sheet==="sit"&&cv.dataset.chair==="1";
    if(chair)await drawChair(ctx,dir,"back",scale,ox,oy);
    if(withBase)await drawBase(ctx,sheet,dir,col,scale,ox,oy,part);
    if(seq!==paintSeq)return;
    if(part){const sh=partSheets(part,variant);await drawLayer(ctx,sh.walk,sh.sit,part.fixed,sheet,dir,col,scale,ox,oy,paletteFor(colour,part.cat))}
    if(chair)await drawChair(ctx,dir,"front",scale,ox,oy);
  }
}

const CHAIR_IMG={};
function chairImg(uri){if(!CHAIR_IMG[uri])CHAIR_IMG[uri]=new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=uri});return CHAIR_IMG[uri]}
async function drawChair(ctx,dir,layer,s,ox,oy){
  for(const p of CHAIR_OBJ.dirs[dir]||[]){
    if(p.above!==(layer==="front"))continue;
    const im=await chairImg(p.uri);if(!im)continue;
    ctx.imageSmoothingEnabled=false;ctx.drawImage(im,ox+p.x*s,oy+p.y*s,p.w*s,p.h*s);
  }
}

function catPanel(){
  const q=(S.catSearch||"").trim().toLowerCase();
  const groups=Object.entries(CATS).map(([g,items])=>{
    const vis=items.filter(c=>!q||c.toLowerCase().includes(q));
    if(!vis.length)return "";
    const closed=S.collapsed.has(g);
    return `<div class="sect"><button class="tmenu" data-group="${g}" aria-expanded="${!closed}"><span>${g}</span><span class="tchev ${closed?"down":""}">${FI(FIG_UI["chevron-up"],14)}</span></button>
   ${closed?"":vis.map(c=>`<button class="menu ${S.cat===c?"active":""}" data-cat="${c}">${FI(CAT_ICONS[c])}<span class="lbl">${c}</span><span class="cnt">${byCat(c).length}</span>${FI(FIG_UI["chevron-right"])}</button>`).join("")}</div>`}).join("");
  return `<section class="panel cat"><div class="hd"><h2>Accessory category</h2><div class="sub">18 Category</div></div>
  <label class="input">${FI(FIG_UI.search)}<input id="catSearch" placeholder="Search for category" value="${S.catSearch||""}"></label>
  <div class="list">${groups}</div></section>`;
}

  const dots=p.variants?p.variants.map(v=>v.hex):[];
  return `<button class="card" data-open="${p.id}"><div class="top"><span class="tag ${hidden?"hidden":"active"}">${I(hidden?"eye-off":"eye")}${hidden?"Hidden":"Active"}</span><span class="count">0</span></div>
  <div class="img"><canvas width="48" height="48" style="width:64px;height:64px" data-part="${p.id}" data-scale="1" data-base="1" data-dir="down" data-col="1" data-colour="#F03A3A"></canvas></div>
  ${dots.length?`<div class="cl">${dots.slice(0,3).map(c=>`<i class="dot" style="background:${c}"></i>`).join("")}${dots.length>3?`<span>+${dots.length-3}</span>`:""}</div>`:""}
  <div><div class="nm">${p.name}</div><div class="dt">${I("calendar")}<span>Sep 18, 2025 (10:00)</span></div></div></button>`;
}
function listPanel(){
  const items=byCat(S.cat),emptyList=items.length===0;
  const pager=`<div class="pager"><button class="pg">${I("chevron-left")}</button><button class="pg on">1</button><button class="pg sel">20 / page ${I("chevron-down")}</button><button class="pg">${I("chevron-right")}</button></div>`;
  return `<section class="panel main"><div class="lhead">
   <div class="ttl"><h2>${S.cat}</h2><button class="btn primary h42" data-go="add">${I("plus")}Add accessory</button></div>
   <div class="srow"><label class="input">${I("search")}<input id="itemSearch" placeholder="Search"></label><button class="btn ghost icon" data-go="filter" aria-label="Filter">${I("filter")}</button></div>
   <div class="meta"><span>${items.length} Item</span><div class="sort">Latest ${I("chevron-down")}</div></div></div>
  ${emptyList?`<div class="grid" style="place-content:center;justify-content:center">${emptyBox("No accessory added","Create accessory for your workspace to make them available for users.",`<button class="btn primary h42" data-go="add">${I("plus")}Add accessory</button>`)}</div>`
   :`<div class="grid">${items.map(card).join("")}</div>`}
  ${pager}
  ${S.overlay==="filter"?`<div class="submenu" style="left:920px;top:132px"><div class="t">Status</div>${["All","Active","Hidden"].map(l=>`<button class="menu"><span class="chk">${I("check")}</span><span class="lbl">${l}</span></button>`).join("")}</div>`:""}
  </section>`;
}
function formPanel(){
  const sc=S.screen, part=byId(S.part)||byCat(S.cat)[0];
  const view=sc==="edit-view", editing=["edit-mode","edit-hidden","modal-1","modal-2","modal-3","toast-saved"].includes(sc);
  const special=S.cat==="Special Costume", two=TWO_SHEETS.includes(S.cat), ro=view?"ro":"";
  const nameVal=S.filled||view||editing?part.name:"";
  const canSave=S.uploaded;
  const head=view?`<button class="btn danger" data-go="modal-1">${I("trash")}Delete</button><button class="btn primary" data-go="edit-mode">${I("edit")}Edit</button>`
   :editing?`<button class="btn danger" data-go="modal-1">${I("trash")}Delete</button><button class="btn white" data-go="edit-view">${I("x")}Cancel</button><button class="btn primary" data-go="toast-saved">${I("check")}Save</button>`
   :`<button class="btn white" data-go="list">${I("x")}Cancel</button><button class="btn ${canSave?"primary":"disabled"}" ${canSave?'data-go="toast-saved"':""}>${I("check")}Save</button>`;
  const exp=special?`<div class="radios"><button class="radio ${!S.expire?"on":""} ${view&&S.expire?"dis":""}" data-exp="0"><i></i>No determine</button><button class="radio ${S.expire?"on":""} ${view&&!S.expire?"dis":""}" data-exp="1"><i></i>Set expiration</button></div>
   ${S.expire?`<div class="two"><div class="field"><label>Start date</label><div class="input ${ro}"><span class="ph">${S.filled||view||editing?"01/01/2026":"DD/MM/YYYY"}</span>${I("calendar")}</div></div><div class="field"><label>End date</label><div class="input ${ro}"><span class="ph">${S.filled||view||editing?"01/04/2026":"DD/MM/YYYY"}</span>${I("calendar")}</div></div></div>`:""}`:"";
  const statusRow=`<div class="field"><label>Status</label><div class="status"><button class="switch ${S.active?"on":""}" data-toggle="1" aria-label="Status"></button><span class="${S.active?"on":"off"}">${S.active?"Active":"Hidden"}</span></div></div>`;
  let up;
  const hasFile=view||editing||S.uploaded;
  if(special){
    const rows=hasFile?part.variants:[null];
    const fileCell=l=>hasFile?`<div class="chip"><span>${l}</span>${view?"":I("x")}</div>`:`<button class="btn ghost sm" style="flex:1">${I("plus")}Choose file</button>`;
    up=`<div class="variant"><div class="table">
      <div class="tr"><div class="th c-name">Colour</div><div class="th c-file">Walking spritesheet</div><div class="th c-file">Sitting spritesheet</div></div>
      ${rows.map((v,i)=>`<div class="tr"><div class="td c-wheel"><button class="wheel ${v?"":"g"}" style="${v?`background:${v.hex}`:""}" data-go="picker" aria-label="Pick colour"></button></div><div class="td c-name" style="color:${v?"var(--fg)":"var(--grey500)"}">${v?v.name:"Input colour name"}</div><div class="td c-file">${fileCell(`${part.name} ${v?v.name.toLowerCase():""} walk.png`)}</div><div class="td c-file">${fileCell(`${part.name} ${v?v.name.toLowerCase():""} sit.png`)}</div></div>`).join("")}
     </div>${view?"":`<button class="btn primary sm">${I("plus")}Add colour varient</button>`}</div>`;
  }else{
    const zone=(l,fn)=>`<div class="gen"><div class="l">${l}</div>${hasFile?`<div class="file"><span class="ic">${I("image")}</span><div class="nm"><span>${fn}</span><small>Size: ${Math.round(fn.length*37)} kb • <b>Completed</b></small></div>${view?"":`<button class="del" aria-label="Remove">${I("trash")}</button>`}</div>`:`<div class="drop"><span class="btn ghost icon sm">${I("upload")}</span><span>Drag and drop file here or <u>choose file</u></span></div>`}</div>`;
    up=`<div class="upload">${zone("Walking spritesheet",`${part.name} walk.png`)}${two?zone("Sitting spritesheet",`${part.name} sit.png`):""}</div>`;
  }
  const sheetName=S.mode==="sitting"?"sit":"walk", col=S.mode==="walking"?tick%4:S.mode==="sitting"?2:1;
  const previewCanvas=`<canvas id="pv" width="160" height="160" data-part="${part.id}" data-scale="3" data-base="1" data-chair="1" data-dir="${S.dir}" data-sheet="${sheetName}" data-col="${col}" data-variant="${S.variant}"></canvas>`;
  const swatchRow=special?(hasFile?`<div class="swatches">${part.variants.map((v,i)=>`<button style="background:${v.hex}" data-variant="${i}" aria-pressed="${i===S.variant}" aria-label="${v.name}"></button>`).join("")}</div>`:"")
   :(hasFile?`<div class="colourpick">
      <div class="swatches">${HUES.map(c=>`<button style="background:${c}" data-hue="${c}" aria-pressed="${c===S.hue}" aria-label="Main colour ${c}" title="${c}"></button>`).join("")}</div>
      <div class="shade">
        <div class="shadehd"><label for="shadeRange">Shade</label><span class="shadeval"><i id="shadeChip" style="background:${S.colour}"></i><span id="shadeHex">${S.colour}</span></span></div>
        <input id="shadeRange" type="range" min="0" max="100" step="1" value="${S.shade}" style="--track:${shadeTrack(S.hue)}" aria-label="Shade">
        <div class="shadeends"><span>Light</span><span>Dark</span></div>
      </div>
    </div>`:"");
  return `<section class="panel main wide">
   <div class="ttl"><div class="back"><button data-go="list" aria-label="Back">${I("chevron-left")}</button><h2>${view||editing?"Edit accessory":"Add accessory"}</h2></div><div class="titlebtns">${head}</div></div>
   <div class="form"><div class="left">
    <div class="sec"><div class="sech"><h3>Property setting</h3><p>Configure accessory properties.</p></div>
     <div class="fields">
      <div class="field"><label for="accName">Accessory name</label><div class="input ${ro} ${S.err?"err":""}">${view?`<span class="ph">${nameVal}</span>`:`<input id="accName" placeholder="Please input accessory name" value="${nameVal}">`}</div>
       <div class="counter">${S.err?'<span class="e">This accessory name already exists. Please use a different name.</span>':""}<span class="n"><b>${nameVal.length}</b>/50</span></div></div>
      <div class="field"><label>Category</label><div class="input ro"><span class="ph">${S.cat}</span>${I("chevron-down")}</div></div>
      ${exp}${statusRow}
     </div></div>
    <div class="divider"></div>
    <div class="sec"><div class="sech"><h3>Upload accessory ${I("info")}</h3><p>Add custom accessories for users to personalize their avatars.</p></div>
     <div class="upload"><div class="alert">${I("info")}<span>Upload a PNG image with only transparent background (max 2 MB).</span></div>${up}</div></div>
   </div>
   <div class="right"><div class="sech"><h3>Preview</h3><p>Review your accessory before adding it to the collection.</p></div>
    <div class="tabs" role="tablist">${[["idle","Idle"],["walking","Walking"],["sitting","Sitting"]].map(([k,l])=>`<button role="tab" data-mode="${k}" aria-selected="${S.mode===k}">${l}</button>`).join("")}</div>
    <div class="preview">${hasFile?previewCanvas:`<canvas id="pv" width="160" height="160" data-part="__base" data-scale="3" data-base="1" data-chair="1" data-dir="${S.dir}" data-sheet="${sheetName}" data-col="${col}"></canvas>`}<div class="ctl"><button class="btn ghost icon sm" data-rot="1" aria-label="Rotate">${I("rotate-cw")}</button><button class="btn ghost icon sm" data-rot="-1" aria-label="Rotate back">${I("rotate-ccw")}</button></div></div>
    ${swatchRow}
   </div></div>
   ${S.overlay==="picker"?picker():""}
  </section>`;
}
function picker(){
  return `<div class="picker"><div class="pal"><i></i></div>
   <div class="row">${I("pipette")}<div class="sl"><div class="hue"></div><div class="sat"></div></div></div>
   <div class="vals"><div class="dd"><span style="flex:1">HSL</span>${I("chevron-down")}</div><div class="v"><span>242</span><span>66</span><span>39</span><span>100%</span></div></div>
   <h4>Saved Colors</h4><div class="sw">${["#FF2E2E","#FF7A1A","#FFD24A","#A020C0","#FF6B6B","#B9A9A9","#C6E82E","#7A1F1F","#1B2E7A","#5A0F0F","#6A2BA8","#3F7A0A","#1B9A9A"].map(c=>`<i style="background:${c}"></i>`).join("")}</div></div>`;
}
function modal(v){
  const part=byId(S.part)||byCat(S.cat)[0];
  const body=v===1?`<p>This accessory will be permanently removed from the system. This action cannot be undone.</p>`
   :v===2?`<p>This accessory is currently used by 100 users. Deleting it may affect their avatars and remove the accessory from their appearance.</p>`
   :`<div class="field"><label for="confirmName">Confirm delete “${part.name}”</label><label class="input"><input id="confirmName" placeholder="Enter “${part.name}” to delete this accessory"></label></div>`;
  return `<div class="overlay" data-close="1"><div class="modal" role="dialog" aria-modal="true"><div class="mh"><div class="mt"><span>Delete accessory?</span><button data-go="edit-view" aria-label="Close">${I("x")}</button></div><div class="divider"></div></div>
   ${body}<div class="mf"><button class="btn white sm" data-go="edit-view">Cancel</button><button class="btn ${v===3?"disabled":"danger solid"} sm" ${v===3?"":'data-go="toast-saved"'}>Delete</button></div></div></div>`;
}
function toast(kind){
  const T={saved:["ok","check","","Accessory saved successfully."],png:["bad","x","Upload failed","Only PNG files are supported."],size:["bad","x","Upload failed","The file must be 2 MB or smaller."],alpha:["bad","x","Invalid PNG image","The uploaded PNG must include a transparent background."]}[kind];
  return `<div class="toast" role="status"><span class="ib ${T[0]}">${I(T[1])}</span><div class="tx">${T[2]?`<b>${T[2]}</b>`:""}<span>${T[3]}</span></div><button class="x" data-close="1" aria-label="Dismiss">${I("x")}</button></div>`;
}

/* ---------- render ---------- */
const FORM_SCREENS=["add-special","add-special-exp","add-special-filled","add-hair","add-top","add-top-done","picker","edit-view","edit-mode","edit-hidden","modal-1","modal-2","modal-3","toast-saved","err-name","toast-png","toast-size","toast-alpha"];
function render(){
  const f=document.getElementById("frame"),sc=S.screen;
  let body="";
  if(sc==="empty")body=catPanel()+`<section class="panel main center">${emptyBox("No category selected","Select a category and accessory will appear here.")}</section>`;
  else if(["list","list-empty","list-hair","filter"].includes(sc))body=catPanel()+listPanel();
  else body=formPanel();
  let over="";
  if(sc.startsWith("modal"))over=modal(+sc.slice(-1));
  if(sc==="toast-saved")over=toast("saved");if(sc==="toast-png")over=toast("png");if(sc==="toast-size")over=toast("size");if(sc==="toast-alpha")over=toast("alpha");
  f.innerHTML=sidebar()+body+over+`<div class="hint">1440 × 1024 · Figma Map8gX0L2hk7HnkaFRfhtj · sprites: demo file/custom avatar</div>`;
  document.getElementById("note").innerHTML=`<b>${sc}</b> — ${NOTES[sc]||""}`;
  document.querySelectorAll("#bar .sc").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===sc));
  fit();paintAll();
}
/* repaint only the preview canvas while animating (no full re-render) */
async function paintPreview(){
  const cv=document.getElementById("pv");if(!cv)return;
  const part=byId(cv.dataset.part),ctx=cv.getContext("2d"),scale=3,ox=(160-144)/2,oy=ox;
  const sheet=S.mode==="sitting"?"sit":"walk",col=S.mode==="walking"?tick%4:S.mode==="sitting"?2:1;
  ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,160,160);
  if(sheet==="sit")await drawChair(ctx,S.dir,"back",scale,ox,oy);
  await drawBase(ctx,sheet,S.dir,col,scale,ox,oy,part);
  if(part){const sh=partSheets(part,S.variant);await drawLayer(ctx,sh.walk,sh.sit,part.fixed,sheet,S.dir,col,scale,ox,oy,paletteFor(S.colour,part.cat))}
  if(sheet==="sit")await drawChair(ctx,S.dir,"front",scale,ox,oy);
}
setInterval(()=>{tick++;if(S.mode==="walking")paintPreview()},125);

function go(key){
  const base={cat:S.cat||"Special Costume",overlay:null,expire:false,active:true,filled:false,err:false,uploaded:false,part:S.part,variant:0,mode:"idle",dir:"down"};
  const map={
   "empty":{cat:null},"list-empty":{cat:"Mask"},"list":{cat:"Special Costume"},"list-hair":{cat:"Hair"},"filter":{cat:"Special Costume",overlay:"filter"},
   "add-special":{cat:"Special Costume",part:"thaiw"},"add-special-exp":{cat:"Special Costume",part:"thaiw",expire:true},"add-special-filled":{cat:"Special Costume",part:"thaiw",expire:true,filled:true,uploaded:true},
   "add-hair":{cat:"Hair",part:"hairthai",filled:true},"add-top":{cat:"Top",part:"top1",filled:true},"add-top-done":{cat:"Top",part:"top1",filled:true,uploaded:true},
   "picker":{cat:"Special Costume",part:"thaiw",filled:true,uploaded:true,overlay:"picker"},
   "edit-view":{filled:true,expire:true},"edit-mode":{filled:true},"toast-saved":{filled:true},
   "edit-hidden":{filled:true,active:false},
   "modal-1":{filled:true},"modal-2":{filled:true},"modal-3":{filled:true},
   "err-name":{cat:"Special Costume",part:"thaiw",filled:true,err:true},"toast-png":{cat:"Special Costume",part:"thaiw",filled:true},"toast-size":{cat:"Special Costume",part:"thaiw",filled:true},"toast-alpha":{cat:"Special Costume",part:"thaiw",filled:true},
  };
  if(!map[key])return;
  const next=Object.assign({},base,map[key],{screen:key});
  if(key.startsWith("edit")||key.startsWith("modal")||key==="toast-saved"){ if(!next.part||byId(next.part).cat!==next.cat){next.part=(byCat(next.cat)[0]||byId("thaiw")).id;next.cat=byId(next.part).cat} if(key==="edit-hidden")S.hidden.add(next.part); else if(key==="edit-mode")S.hidden.delete(next.part); next.active=!S.hidden.has(next.part)}
  Object.assign(S,next);render();
}
document.getElementById("bar").insertAdjacentHTML("beforeend",SCENARIOS.map(g=>`<div class="grp"><span>${g.g}</span>${g.items.map(([k,l])=>`<button class="sc" data-s="${k}">${l}</button>`).join("")}</div>`).join(""));
function applyShade(){
  S.colour=shadeHex(S.hue,S.shade);
  const r=document.getElementById("shadeRange");if(r)r.style.setProperty("--track",shadeTrack(S.hue));
  const ch=document.getElementById("shadeChip");if(ch)ch.style.background=S.colour;
  const hx=document.getElementById("shadeHex");if(hx)hx.textContent=S.colour;
  paintPreview();
}
document.addEventListener("input",e=>{if(e.target.id==="shadeRange"){S.shade=+e.target.value;applyShade();return}
if(e.target.id==="catSearch"){S.catSearch=e.target.value;const list=document.querySelector(".cat .list");if(list){const q=S.catSearch.trim().toLowerCase();list.innerHTML=catPanel().match(/<div class="list">([\s\S]*)<\/div><\/section>$/)[1]}}});
document.addEventListener("click",e=>{
  const grp=e.target.closest("[data-group]");if(grp){const g=grp.dataset.group;S.collapsed.has(g)?S.collapsed.delete(g):S.collapsed.add(g);render();return}
  const b=e.target.closest("[data-s]");if(b){go(b.dataset.s);return}
  const g=e.target.closest("[data-go]");if(g){const k=g.dataset.go;if(k==="add"){go(S.cat==="Special Costume"?"add-special":S.cat==="Hair"?"add-hair":TWO_SHEETS.includes(S.cat)?"add-top":"add-hair")}else if(k==="list"){go(S.cat==="Hair"?"list-hair":byCat(S.cat).length?"list":"list-empty")}else go(k);return}
  const c=e.target.closest("[data-cat]");if(c){S.cat=c.dataset.cat;S.part=null;S.screen=byCat(S.cat).length?"list":"list-empty";S.overlay=null;render();return}
  const o=e.target.closest("[data-open]");if(o){S.part=o.dataset.open;S.cat=byId(S.part).cat;go("edit-view");return}
  const t=e.target.closest("[data-toggle]");if(t&&S.screen!=="edit-view"){S.active=!S.active;if(S.active)S.hidden.delete(S.part);else S.hidden.add(S.part);S.screen=S.active?"edit-mode":"edit-hidden";render();return}
  const x=e.target.closest("[data-exp]");if(x&&S.screen!=="edit-view"){S.expire=x.dataset.exp==="1";render();return}
  const m=e.target.closest("[data-mode]");if(m){S.mode=m.dataset.mode;document.querySelectorAll("[data-mode]").forEach(el=>el.setAttribute("aria-selected",el===m));paintPreview();return}
  const r=e.target.closest("[data-rot]");if(r){const order=["down","right","up","left"];S.dir=order[(order.indexOf(S.dir)+ +r.dataset.rot+4)%4];paintPreview();return}
  const v=e.target.closest("[data-variant]");if(v){S.variant=+v.dataset.variant;document.querySelectorAll("[data-variant]").forEach(el=>el.setAttribute("aria-pressed",el===v));paintPreview();return}
  const hu=e.target.closest("[data-hue]");if(hu){S.hue=hu.dataset.hue;applyShade();document.querySelectorAll("[data-hue]").forEach(el=>el.setAttribute("aria-pressed",el===hu));return}
  const cl=e.target.closest("[data-colour]");if(cl){S.colour=cl.dataset.colour;document.querySelectorAll("[data-colour]").forEach(el=>el.setAttribute("aria-pressed",el===cl));paintPreview();return}
  if(e.target.closest("[data-close]")){S.screen=S.screen.startsWith("modal")||S.screen==="toast-saved"?"edit-view":S.screen.startsWith("toast")?"add-special":S.screen;S.overlay=null;render();return}
  if(S.overlay&&!e.target.closest(".submenu,.picker")){S.overlay=null;if(S.screen==="filter")S.screen="list";if(S.screen==="picker")S.screen="add-special-filled";render()}
});
function fit(){const st=document.querySelector(".stage"),f=document.getElementById("frame");const k=Math.min(1,st.clientWidth/1440);f.style.transform=`scale(${k})`;st.style.height=(1024*k)+"px"}
addEventListener("resize",fit);
go("list");
</script>
